# OSSF Scorecard: automatically evaluates the supply-chain security
# posture of the repository and uploads results to the GitHub
# Security > Code scanning tab.
#
# Docs: https://github.com/ossf/scorecard-action
name: Scorecard supply-chain security

on:
  # For branch protection (main) only. Run a fresh analysis on a schedule
  # and also whenever the default branch is updated.
  branch_protection_rule:
  schedule:
    - cron: "0 12 * * 1" # Every Monday at 12:00 UTC
  push:
    branches: ["main"]

# Declare default read-only permissions. The workflow only needs write
# access to upload results to the Security tab.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to the code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge.
      id-token: write
      # Uncomment the permissions below if installing in a private repository.
      # contents: read
      # actions: read

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          # (Optional) "read-only" token to unblock the analysis and reduce
          # interruptions caused by API rate limits. Create a PAT with
          # `public_repo` scope and add it as the SCORECARD_TOKEN secret.
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF results
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          sarif_file: results.sarif
