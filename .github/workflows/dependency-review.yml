# Dependency Review: blocks pull requests that introduce known-vulnerable
# or non-compliant dependencies before they are merged.
#
# Docs: https://github.com/actions/dependency-review-action
name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required to comment the dependency review summary.
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
