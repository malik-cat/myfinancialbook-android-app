# ============================================================================
# SLSA provenance generation
#
# Generates cryptographically signed, non-forgeable SLSA Build Level 3
# provenance (in-toto attestations) for every APK built from a tagged
# release (`v*`). Artifacts and their `provenance.intoto.jsonl` are
# attached to the GitHub release.
#
# Docs: https://github.com/slsa-framework/slsa-github-generator
# Verify: https://github.com/slsa-framework/slsa-verifier
# ============================================================================
name: SLSA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Read-only by default. The `provenance` job elevates only the permissions
# required by the SLSA generator.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            echo "${GOOGLE_SERVICES_JSON}" > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret is not set. " \
                 "The google-services Gradle plugin will fail unless " \
                 "app/google-services.json exists in the repo."
          fi

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Build release artifacts
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" -exec cp {} dist/ \;

      - name: Generate subject digests
        id: hash
        run: |
          echo "digests=$(sha256sum dist/* | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: dist/

  # SLSA Level 3 provenance. The generator runs in an isolated reusable
  # workflow with its own OIDC identity, so build steps cannot tamper with
  # the attestation it produces.
  provenance:
    needs: [build]
    permissions:
      actions: read # For the GitHub Actions environment information.
      id-token: write # For signing the provenance with Sigstore.
      contents: write # For uploading artifacts to the release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true
